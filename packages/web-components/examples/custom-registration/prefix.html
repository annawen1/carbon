<html>
  <head>
    <title>Prefixed build</title>
    <meta charset="UTF-8" />
    <link
      rel="stylesheet"
      href="https://1.www.s81c.com/common/carbon-for-ibm-dotcom/tag/v1/latest/plex.css"
    />
    <link rel="stylesheet" href="src/styles.scss" />
    <style>
      foo-button:not(:defined) {
        visibility: hidden;
      }
    </style>
    <script type="module">
      // The prefixed build is generated by `npm run generate:prefix`:
      //   create-prefixed-build --prefix foo --out ./vendor/carbon-foo
      // Loaded dynamically so the page degrades gracefully if not generated yet.
      const status = document.querySelector("#prefix-status");
      import("./vendor/carbon-foo/components/button/index.js")
        .then(() => {
          status.textContent =
            "<foo-button /> registered from the prefixed build.";
        })
        .catch(() => {
          status.textContent =
            "Run `npm run generate:prefix` to create ./vendor/carbon-foo, then reload.";
        });
    </script>
  </head>
  <body>
    <h3>Prefixed build</h3>
    <p>
      A whole-package, build-time rename to any prefix — composites included, no
      runtime or polyfill. Generate it first:
    </p>
    <pre><code>npm run generate:prefix
# runs: create-prefixed-build --prefix foo --out ./vendor/carbon-foo</code></pre>
    <div class="demo">
      <foo-button>Prefixed foo-button</foo-button>
      <p id="prefix-status"></p>
    </div>
  </body>
</html>
